name: PrimeQE Portfolio Quality
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/primeqe-portfolio-quality.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/primeqe-portfolio-quality.yml'
  workflow_dispatch:
jobs:
  build-and-check-resume:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/resume-route.test.mjs
